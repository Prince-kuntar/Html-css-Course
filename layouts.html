<!DOCTYPE html>
<html>

  <head>

    <title>Layouts Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

      p {
        margin-top: 0;
        margin-bottom: 0;
      }

      .add-friend-prev {
        background-color: white;
        border: solid;
        width: 200px;
        display: inline-block;
        border-width: 1px;
        border-radius: 4px;
        border-color: rgb(219, 219, 219);
      }

      .profile {
        width: 200px;
        height: 220px;
        margin-bottom: 5px;
      }

      .pp {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right;
      }

      .user-name {
        font-size: 14px;
        font-family: Roboto, Arial;
        color: black;
        font-weight: 700;
        margin-bottom: 5px;
        margin-left: 5px;
      }

      .pics {
        display: inline-block;
        width: 20px;
        border-radius: 10px;
        margin-left: 5px;

      }
      .mutual-friends-number {
        display: inline-block;
        margin-left: 5px;
        vertical-align: top;
      }

      .btn {
        border: none;
        border-radius: 4px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 20px;
        margin-left: 5px;
        margin-bottom: 8px;
        margin-top: 8px;
        padding-right: 20px;
        font-weight: 400;
        color: white;
        font-family: Roboto, Arial;
        background-color: rgb(42, 20, 240);
      }

    </style>
  </head>

  <body>

    <div class="add-friend-prev">
      <div class="profile">
        <img class="pp" src="thumbnails/thumbnail-1.webp">
      </div>
      <p class="user-name">
        Oliver
      </p>
      <div class="mutual-friends">
        <img class="pics" src="channel-pictures/channel-1.jpeg">
        <p class="mutual-friends-number">
          2 mutual friends
        </p>
      </div>

      <button class="btn">
        Add Friend
      </button>
    </div>

    <div class="add-friend-prev">
      <div class="profile">
        <img class="pp" src="thumbnails/thumbnail-2.webp">
      </div>
      <p class="user-name">
        Mimi
      </p>
      <div class="mutual-friends">
        <img class="pics" src="channel-pictures/channel-2.jpeg">
        <p class="mutual-friends-number">
          3 mutual friends
        </p>
      </div>

      <button class="btn">
        Add Friend
      </button>
    </div>

    <div class="add-friend-prev">
      <div class="profile">
        <img class="pp" src="thumbnails/thumbnail-1.webp">
      </div>
      <p class="user-name">
        Rex
      </p>
      <div class="mutual-friends">
        <img class="pics" src="channel-pictures/channel-1.jpeg">
        <p class="mutual-friends-number">
          4 mutual friends
        </p>
      </div>

      <button class="btn">
        Add Friend
      </button>
    </div>

  </body>
</html>
