<!DOCTYPE html>
<html>
  <head>
    <title>Signup Form</title>

    <style>
      .firstname,.surname {
        display: inline-block;
        width: 198px;
        padding: 10px;
        color: black;
        box-sizing: content-box;
        border-color: rgb(95, 94, 94);
        border-style: solid;
        border-width: 1px;
        border-radius: 10px;
        margin-bottom: 10px;

      }
      .email {
        display: block;
        width: 445px;
        padding: 10px;
        box-sizing: border-box;
        color: black;
        border-color: rgb(95, 94, 94);
        border-style: solid;
        border-width: 1px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .signup-btn {
        width: 445px;
        padding: 10px;
        box-sizing: border-box;
        border: none;
        color: white;
        font-family: Tahoma;
        font-weight: bold;
        border-radius: 10px;
        background-color: rgb(38, 0, 255);
      }
    </style>
  </head>

  <body>
    <input class="firstname" type="text" placeholder="First name">
    <input class="surname" type="text" placeholder="Surname">
    <input class="email" type="text" placeholder="Email">
    <button class="signup-btn">Sign Up</button>
  </body>
</html>
