<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Practice</title>
  </head>

  <body style="padding-bottom: 1000px;">
    <div style="display: flex; flex-direction: row; margin-bottom: 30px;">
      <div style="background-color: aqua;">Div 1</div>
      <div style="background-color: coral;">Div 2</div>
    </div>


    <div style="display: flex; flex-direction: row; margin-bottom: 30px;">
      <div style="background-color: aqua; width: 100px;">Div 1</div>
      <div style="background-color: coral; flex: 1;">Div 2</div>
    </div>

    <div style="display: flex; flex-direction: row; justify-content: space-between; height: 70px; border-width: 1px; border-style: solid; border-color: gray;">
      <div style="background-color: aqua; width: 100px;">100px</div>
      <div style="background-color: coral; width: 100px;">Flex 1</div>
      <div style="background-color: aquamarine; width: 100px;">Flex 2</div>
    </div>
  </body>

</html>
