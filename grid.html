<!DOCTYPE html>
<html>
  <head>
    <title>
      Grid Layout Practice
    </title>
  </head>

  <body>
  


    <div style="
      margin-top: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 15px;
      row-gap: 30px;">

      <div style="background-color: aqua; height: 200px;">100px</div>
      <div style="background-color: yellowgreen; height: 200px;">Div 2</div>
      <div style="background-color: aqua; height: 200px;">200px</div>

      <div style="background-color: yellowgreen; height: 200px;">Div 2</div>
      <div style="background-color: aqua; height: 200px;">100px</div>
      <div style="background-color: yellowgreen; height: 200px;">Div 2</div>

    </div>
  </body>
</html>
