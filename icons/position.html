  <body style="height: 3000px;
  padding-top: 60px;
  padding-left: 70px;">

    <div style="
      background-color: blue;
      color: white;
      height:50px;
      margin-bottom: 10px;

      top: 0px;
      left: 0px;
      right: 0px;">
      Header
    </div>

    <div style="
      background-color: brown;
      color: white;

      left: 0;

      sidebar

    <div style="
      position: absolute;
      background-color: blueviolet;
      color: white;
      left: 10px ;">
      absolute
    </div>

    <div style="
    background-color: aquamarine;
    height: 200px;
    width: 200px;

    <div style="
    background-color: chartreuse;
    height: 200px;
    width: 200px;">Div 2</div>
    
  </body>
