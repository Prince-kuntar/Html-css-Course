<!DOCTYPE html>
<html>

  <head>
    <title>First Website</title>
  </head>

  <body>

    <style>
  .item-txt{
    font-weight: bold;
    font-size: 30px;
  }

  .price-txt{
    font-weight: bold;
    color: rgb(0, 118, 0);
    font-size: 18px;
  }

  .delivery{
    color: black;
    font-size: 18px;
  }

  .cart-btn{
    border: none;
    background-color: rgb(255, 216, 20);
    height: 32px;
    border-radius: 16px;
    color: black;
    width: 110px;
    cursor: pointer;
    margin-right: 10px;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    transition: opacity 0.15s;
    box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.3);
  }

  .cart-btn:hover {
    opacity: 0.7;
  }
  .cart-btn:active {
    opacity: 0.5;
  }

  .buy-btn{
    border: none;
    background-color: rgb(197, 165, 3);
    height: 32px;
    border-radius: 16px;
    color: black;
    width: 110px;
    cursor: pointer;
    margin-right: 10px;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    transition: opacity 0.15s;
    box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.3);
  }

  .buy-btn:hover {
    opacity: 0.7;
  }
  .buy-btn:active {
    opacity: 0.5;
  }

  .back-btn{
    color: rgb(2, 153, 153);
    font-weight: bold;
    font-size: 15px;
  }
</style>




<a href="https://www.amazon.com" class="back-btn">
  Back to Amazon
</a>

<p class="item-txt">
  Nike Black Running Shoes
</p>

<p class="price-txt">
  $39 - in stock.
</p>

<p class="delivery">
  Free delivery tommorow
</p>

<button class="cart-btn">
  Add to cart 
</button>

<button class="buy-btn">
  Buy now 
</button>
  </body>
</html>
